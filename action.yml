name: 'TypeScript Action Recipe'
description:
  'Waits for some milliseconds, writes an awesome job summary to the workflow
  output and returns the current date and time.'
author: 'Mardhiah Kamal'

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: heart
  color: red

# Define your inputs here.
inputs:
  milliseconds:
    description: 'Try lu jadi tak'
    required: true
    default: '1000'

# Define your outputs here.
outputs:
  time:
    description: 'Jadi wehhhh'

runs:
  using: node24
  main: dist/index.js
